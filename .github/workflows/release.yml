name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${owner_lc}/quotahub" >> "$GITHUB_OUTPUT"
          previous_tag="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)"
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run backend tests
        working-directory: backend
        run: |
          uv sync --all-groups --frozen
          uv run python -m pytest -q

      - name: Package release assets
        run: |
          chmod +x scripts/*.sh
          mkdir -p dist
          ./scripts/package-uv.sh "${{ steps.meta.outputs.tag }}" dist
          ./scripts/package-source.sh "${{ steps.meta.outputs.tag }}" dist
          (cd dist && sha256sum quotahub-*.zip > SHA256SUMS)

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            QUOTAHUB_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

      - name: Render release notes
        run: |
          chmod +x scripts/render-release-notes.sh
          ./scripts/render-release-notes.sh \
            "${{ steps.meta.outputs.tag }}" \
            "${{ steps.meta.outputs.previous_tag }}" > dist/release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          files: |
            dist/quotahub-${{ steps.meta.outputs.tag }}-uv.zip
            dist/quotahub-${{ steps.meta.outputs.tag }}-source.zip
            dist/SHA256SUMS
